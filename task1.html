<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1 - Book a Train Ticket</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body class="bg-light p-3">
    <main class="ticket-card mx-auto p-4">
      <h2 class="title mb-3">Book a train ticket</h2>

      <form action="#" method="post">
        <div class="trip-toggle mb-3">
          <input
            type="radio"
            class="btn-check"
            name="tripType"
            id="oneWay"
            value="oneWay"
            checked
          />
          <label class="btn trip-btn" for="oneWay">One way</label>

          <input
            type="radio"
            class="btn-check"
            name="tripType"
            id="roundTrip"
            value="roundTrip"
          />
          <label class="btn trip-btn" for="roundTrip">Round trip</label>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-12 col-md-6">
            <label for="fromCity" class="form-label">From</label>
            <input
              type="text"
              id="fromCity"
              class="form-control"
              value="Astana"
              required
            />
          </div>
          <div class="col-12 col-md-6">
            <label for="toCity" class="form-label">To</label>
            <input
              type="text"
              id="toCity"
              class="form-control"
              value="Almaty"
              required
            />
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-12 col-md-4">
            <label for="departureDate" class="form-label">Departure</label>
            <input
              type="date"
              id="departureDate"
              class="form-control"
              required
            />
          </div>
          <div class="col-12 col-md-4">
            <label for="returnDate" class="form-label">Return</label>
            <input type="date" id="returnDate" class="form-control" />
          </div>
          <div class="col-12 col-md-4">
            <label for="passengers" class="form-label">Passengers</label>
            <select id="passengers" class="form-select">
              <option value="1">1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
              <option value="5">5 adults</option>
              <option value="6">6 adults</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label d-block">Carriage class</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="carriageClass"
                id="seat"
                value="seat"
                required
              />
              <label class="form-check-label" for="seat">Seat</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="carriageClass"
                id="coupe"
                value="coupe"
                checked
                required
              />
              <label class="form-check-label" for="coupe">Coupé</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="carriageClass"
                id="sleeper"
                value="sleeper"
                required
              />
              <label class="form-check-label" for="sleeper">Sleeper</label>
            </div>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-group">
              <span class="input-group-text bg-teal text-white border-0"
                >+7</span
              >
              <input
                type="tel"
                id="phone"
                class="form-control"
                placeholder="701 234 56 78"
                required
              />
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="name@example.com"
              required
            />
          </div>
        </div>

        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="smsNotify" />
            <label class="form-check-label" for="smsNotify"
              >Also send the ticket by SMS</label
            >
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="rulesAgree"
              required
            />
            <label class="form-check-label" for="rulesAgree"
              >I agree with the carriage rules</label
            >
          </div>
        </div>

        <div
          class="d-flex flex-column flex-md-row justify-content-md-end gap-2 mt-4"
        >
          <button type="reset" class="btn btn-clear order-2 order-md-1">
            Clear
          </button>
          <button type="submit" class="btn btn-find order-1 order-md-2">
            Find trains
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
