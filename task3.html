<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3 - Reserve a Table</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light p-3">
    <main
      class="mx-auto p-4 bg-white rounded-3 border"
      style="max-width: 500px"
    >
      <h2 class="mb-3">Reserve a table</h2>

      <form action="#" method="post">
        <div class="mb-3">
          <label for="name" class="form-label">Your name *</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email *</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone *</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label for="guests" class="form-label">Guests *</label>
          <input
            type="number"
            id="guests"
            name="guests"
            class="form-control"
            min="1"
            max="10"
            required
          />
        </div>

        <div class="mb-3">
          <label for="resDate" class="form-label">Date *</label>
          <input
            type="date"
            id="resDate"
            name="resDate"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label d-block">Seating *</label>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="seating"
              id="inside"
              value="inside"
              required
            />
            <label class="form-check-label" for="inside">Inside</label>
          </div>
          <div class="form-check form-check-inline">
            <input
              class="form-check-input"
              type="radio"
              name="seating"
              id="terrace"
              value="terrace"
              required
            />
            <label class="form-check-label" for="terrace">Terrace</label>
          </div>
        </div>

        <div class="mb-3">
          <label for="meal" class="form-label">Meal *</label>
          <select id="meal" name="meal" class="form-select" required>
            <option value="" selected disabled>Choose meal time...</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="comments" class="form-label">Comments</label>
          <textarea
            id="comments"
            name="comments"
            class="form-control"
            rows="3"
          ></textarea>
        </div>

        <div class="mb-4 form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="terms"
            name="terms"
            required
          />
          <label class="form-check-label" for="terms"
            >I agree to the terms *</label
          >
        </div>

        <button type="submit" class="btn btn-primary w-100">Reserve</button>
      </form>
    </main>
  </body>
</html>
